workflows:
  android-apk:
    name: Fuel Calculator APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Setup Flutter project
        script: |
          flutter create --org com.fuelcalculator --project-name fuel_calculator --platforms=android temp_project
          cp -r lib temp_project/ 2>/dev/null || true
          cp pubspec.yaml temp_project/pubspec.yaml
      - name: Get packages
        script: |
          cd temp_project
          flutter pub get
      - name: Build APK
        script: |
          cd temp_project
          flutter build apk --release
    artifacts:
      - temp_project/build/**/outputs/**/*.apk
